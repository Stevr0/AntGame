[project]
site_name = "Ant Colony Development Wiki"
site_description = "Design, implementation status, architecture, and milestone evidence for Ant Colony."
site_url = "https://stevr0.github.io/AntGame/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/Stevr0/AntGame"
repo_name = "Stevr0/AntGame"
edit_uri = "edit/main/docs/"
copyright = "Ant Colony development documentation"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Game Overview" = "game-overview.md" },
  { "Gameplay Mechanics" = "gameplay-mechanics.md" },
  { "Gameplay Architecture Audit" = "gameplay-architecture-audit.md" },
  { "Ants, Attributes and Skills" = "ants-attributes-skills.md" },
  { "Ant Movement and Navigation" = "ant-movement-navigation.md" },
  { "World View Foundation" = "world-view-foundation.md" },
  { "Isometric World View Calibration" = "isometric-world-view-calibration.md" },
  { "Isometric Runtime Terrain Slice" = "isometric-world-view-runtime-slice.md" },
  { "Procedural World Generation" = "procedural-world-generation.md" },
  { "Resource and Node System" = "resource-and-node-system.md" },
  { "Unified Runtime Cells" = "unified-runtime-cells.md" },
  { "Excavation and Terrain" = "excavation-terrain.md" },
  { "Art Foundation" = "art-foundation.md" },
  { "Colony Construction and Rooms" = "colony-construction-rooms.md" },
  { "Placement Migration" = "placement-migration.md" },
  { "Food, Water and Survival" = "food-water-survival.md" },
  { "Brood and Reproduction" = "brood-reproduction.md" },
  { "Ant AI and Job Management" = "ant-ai-job-management.md" },
  { "Technical Architecture" = [
    "technical-architecture.md",
    { "Documentation Workflow" = "documentation-workflow.md" },
  ] },
  { "Development Roadmap" = "development-roadmap.md" },
  { "Milestone History" = "milestone-history.md" },
  { "Design Decision Log" = "design-decision-log.md" },
]

[project.plugins.search]
enabled = true

[project.theme]
variant = "classic"
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/bug"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "green"
accent = "light-green"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "green"
accent = "lime"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
